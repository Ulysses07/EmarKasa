name: Kasa CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Haftalık: yalnız temel imaj özetlerinin tazeliği (base-images). GitHub zamanlanmış koşuyu yalnız varsayılan dalda
  # çalıştırır; varsayılan dal bu hat olmadıkça tetiklenmez (docs/deploy/dal-durumu.md).
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

# Zamanlanmış koşu ayrı gruptadır: haftalık özet denetimi aynı daldaki push CI'ını iptal etmez, push da onu.
concurrency:
  group: kasa-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'haftalik' || 'ci' }}
  cancel-in-progress: true

jobs:
  web-tests:
    name: Mobile web logic
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Bu iş paket kurmaz (kökte package.json yok); v5'ten beri gelen otomatik paket yöneticisi önbelleği açıkça kapalı.
          package-manager-cache: false
          node-version: '24'
      - run: node --test Kasa.Api.Ui.Tests/*.test.mjs
      - run: node --input-type=module --check < Kasa.Api/wwwroot/app.js
      - run: node --input-type=module --check < Kasa.Api/wwwroot/m/app.js

  # wwwroot ESLint (Aşama 2a): yalnız hata yakalayan kurallar (tanımsız ad, yinelenen anahtar/dal, sabite atama, NaN
  # karşılaştırması...); biçim kuralı yok. Araç wwwroot dışında Kasa.Ui.E2E'nin kilit dosyasıyla kurulur (tam sürüm);
  # wwwroot'a paket, derleme adımı ya da node_modules girmez.
  web-lint:
    name: Web lint (ESLint)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Kasa.Ui.E2E/package-lock.json
      - name: Install pinned lint tools
        working-directory: Kasa.Ui.E2E
        run: npm ci --no-audit --no-fund
      - name: Lint wwwroot JavaScript
        working-directory: Kasa.Ui.E2E
        run: npm run lint:web

  tests:
    name: Test ${{ matrix.project }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - Kasa.Core.Tests
          - Kasa.Api.Tests
          - Kasa.ApiClient.Tests
          - Kasa.App.Core.Tests
          # Gerçek KasaApiClient ↔ gerçek Kasa.Api sözleşmesi (bellek içi SQLite; ağ ve iş yükü gerekmez).
          - Kasa.Sozlesme.Tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
      - name: Select the installed .NET 10 SDK
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --roll-forward latestPatch
      - name: Restore test dependencies
        run: dotnet restore "${{ matrix.project }}/${{ matrix.project }}.csproj"
      - name: Run tests
        run: dotnet test "${{ matrix.project }}/${{ matrix.project }}.csproj" --configuration Release --no-restore

  # Web arayüzü uçtan uca korumaları (Aşama 2a; Kasa.Ui.E2E/playwright.config.mjs): Kasa.Api, Kasa.Ui.E2E/Sunucu
  # barındırıcısıyla geçici SQLite, durmuş saat (2026-09-25) ve koşuda üretilen test kimliğiyle yalnız 127.0.0.1'de açılır;
  # canlı sunucuya istek gitmez. Masaüstü 1280 px ve telefon 360/375 px (/m/) ana ekranlarında axe WCAG 2.2 AA taraması
  # (Kasa.Ui.E2E/testler/axe-tabani.json'a göre yalnız YENİ ihlal kırar) ve rol bazlı erişilebilirlik ağacı anlık görüntüsü;
  # ikisi de platformdan bağımsızdır. Chromium (yalnız headless shell) Playwright sürümüne bağlı anahtarla önbellekten gelir;
  # önbellenemeyen sistem bağımlılıkları her koşuda kurulur.
  ui-e2e:
    name: UI e2e (axe + ARIA)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        id: dotnet
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
      - name: Select the installed .NET 10 SDK
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --roll-forward latestPatch
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Kasa.Ui.E2E/package-lock.json
      - name: Install pinned test tools
        id: araclar
        working-directory: Kasa.Ui.E2E
        run: |
          npm ci --no-audit --no-fund
          echo "playwright=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: tarayici
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ steps.araclar.outputs.playwright }}
      - name: Install Chromium and its system dependencies
        if: steps.tarayici.outputs.cache-hit != 'true'
        working-directory: Kasa.Ui.E2E
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Chromium system dependencies (browser restored from cache)
        if: steps.tarayici.outputs.cache-hit == 'true'
        working-directory: Kasa.Ui.E2E
        run: npx playwright install-deps chromium
      - name: Build the e2e server
        run: dotnet build Kasa.Ui.E2E/Sunucu/Kasa.Ui.E2E.Sunucu.csproj --configuration Release
      - name: Run axe and ARIA snapshot checks
        working-directory: Kasa.Ui.E2E
        env:
          KASA_E2E_DERLENDI: '1'
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-e2e-rapor
          path: |
            Kasa.Ui.E2E/playwright-report/
            Kasa.Ui.E2E/test-results/
          retention-days: 14

  # Ekran görüntüsü karşılaştırması (Aşama 2a): yazı tipi ve çizim platforma bağlı olduğundan iş, tabanların üretildiği
  # resmi Playwright imajında (etiket + özet; sürüm Kasa.Ui.E2E'deki @playwright/test ile aynı) koşar; tarayıcılar imajın
  # içindedir, indirilmez. Tabanlar (Kasa.Ui.E2E/testler/__ekran__) yerelde aynı imajla Kasa.Ui.E2E/linux-kosu.sh üretir.
  # Fark çıkınca rapor ve gerçek görüntüler (test-results/*-actual.png) eser olarak yüklenir.
  ui-screenshots:
    name: UI screenshots (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        id: dotnet
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
      - name: Select the installed .NET 10 SDK
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --roll-forward latestPatch
      - name: Install pinned test tools
        working-directory: Kasa.Ui.E2E
        run: npm ci --no-audit --no-fund
      - name: Build the e2e server
        run: dotnet build Kasa.Ui.E2E/Sunucu/Kasa.Ui.E2E.Sunucu.csproj --configuration Release
      - name: Compare screenshots with the Linux baselines
        working-directory: Kasa.Ui.E2E
        env:
          KASA_E2E_DERLENDI: '1'
          KASA_E2E_EKRAN: '1'
          KASA_E2E_ERISIM: '0'
        run: npx playwright test
      - name: Upload Playwright report and actual screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-ekran-rapor
          path: |
            Kasa.Ui.E2E/playwright-report/
            Kasa.Ui.E2E/test-results/
          retention-days: 14

  # Dağıtım betikleri: sunucu dışı yedek (devops-9), temel imaj özeti denetimi (devops-12) ve geri yükleme aracı;
  # sözdizimi, kuru çalıştırma ve birim sınamaları. Runner'daki python3 yeterli; ağ, docker, rclone ve ek paket gerekmez.
  deploy-scripts:
    name: Deploy scripts
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s deploy/tests -v
      - run: python3 -m doctest deploy/restore_backup.py

  # Temel imaj özetleri (devops-12): Dockerfile'daki her FROM etiket + @sha256 özetiyle sabittir (biçimi
  # Kasa.Api.Tests/DepoHijyeniTests de denetler). deploy/temel_imaj.py yalnız kayıt meta verisini okur, imaj indirmez:
  # sabit özet kayıtta çözülmeli ve aynı ana sürüm etiketinin (ör. 10.0) güncel özetiyle karşılaştırılır. Sunucudaki
  # güncelleme akışı (deploy/README.md "Güncelleme" 6. adım) aynı betikle eski özette durur. Burada push/PR'da eski
  # özet uyarıdır; haftalık zamanlanmış koşuda hatadır. Güncelleme: docs/deploy/operasyon-runbook.md "Temel imajlar".
  base-images:
    name: Pinned base images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare pinned digests with the registry
        env:
          ZAMANLANMIS: ${{ github.event_name == 'schedule' }}
        run: |
          kod=0
          python3 deploy/temel_imaj.py --github || kod=$?
          # 1 = daha yeni özet var (betik uyarı notunu yazdı); 2 = sabitlenmemiş/çözülemeyen özet ya da docker hatası.
          if [ "$kod" = 1 ] && [ "$ZAMANLANMIS" != true ]; then
            exit 0
          fi
          if [ "$kod" = 1 ]; then
            echo "::error file=Dockerfile::Temel imaj özetleri eski; docs/deploy/operasyon-runbook.md 'Özet güncelleme' adımlarıyla güncelleyin."
          fi
          exit "$kod"

  windows-app:
    name: Build and smoke-test Windows MAUI app
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
      - name: Select the installed .NET 10 SDK
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --roll-forward latestPatch
      - name: Restore MAUI workloads
        run: dotnet workload restore Kasa.App/Kasa.App.csproj
      # Dağıtılan yapılandırma (docs/deploy/windows-exe.md): varsayılan ayarlar, Windows App SDK çalışma zamanına
      # bağlı (framework-dependent) derleme. Gönderilen paketi bu adım derler.
      - name: Restore app dependencies
        run: dotnet restore Kasa.App/Kasa.App.csproj
      - name: Build Windows app (shipped configuration)
        # Derleme kendi geri yüklemesini aynı -f ile yapar; ayrı restore win-x64 çalışma paketini indirmiyordu (NETSDK1112).
        run: dotnet build Kasa.App/Kasa.App.csproj --configuration Release --framework net10.0-windows10.0.19041.0
      # Yalnız duman testi için ikinci derleme: Windows App SDK çalışma zamanı uygulamanın yanına alınır
      # (WindowsAppSDKSelfContained), böylece test runner'da kurulu bir çalışma zamanına dayanmaz. Çıktı ayrı dizine
      # gider; dağıtılan paket bu derlemeden üretilmez.
      - name: Build Windows app for smoke test (self-contained Windows App SDK)
        # Geri yükleme derlemenin içinde, aynı -f ve özellikle (NETSDK1112).
        run: dotnet build Kasa.App/Kasa.App.csproj --configuration Release --framework net10.0-windows10.0.19041.0 -p:WindowsAppSDKSelfContained=true --output "${{ runner.temp }}/kasa-smoke"
      # Duman testi (tests-9): uygulama açılır, pencere gelir ve kabuk, kaynak sözlükleri ve giriş sayfası yüklenirken
      # çökmez. Derlemeyi geçen XAML kaynak hataları, DI eksikleri ve açılış istisnaları burada kırılır. KASA_API_URL
      # ulaşılamayan yerel adrestir: canlı sunucuya istek gitmez, oturum doğrulaması ağ hatasıyla giriş sayfasına döner.
      - name: Smoke-test Windows app startup
        shell: pwsh
        env:
          KASA_API_URL: http://127.0.0.1:9/
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'kasa-smoke/Kasa.App.exe'
          if (-not (Test-Path $exe)) { throw "Kasa.App.exe bulunamadı: $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          try {
            $pencere = $false
            for ($i = 0; $i -lt 60 -and -not $pencere; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { throw "Kasa.App açılışta kapandı (çıkış kodu $($p.ExitCode))." }
              $p.Refresh(); $pencere = $p.MainWindowHandle -ne [IntPtr]::Zero
            }
            if (-not $pencere) { throw 'Kasa.App 60 saniyede pencere açmadı.' }
            Start-Sleep -Seconds 15
            if ($p.HasExited) { throw "Kasa.App pencere açıldıktan sonra kapandı (çıkış kodu $($p.ExitCode))." }
            $p.Refresh()
            Write-Output "Kasa.App ayakta: pencere '$($p.MainWindowTitle)'."
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
