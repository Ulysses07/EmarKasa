name: Windows desktop release

on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: 'Setup ve ZIP artifactina ek olarak GitHub taslagi olustur'
        type: boolean
        default: false
      release_tag:
        description: 'Yalnız taslak isteniyorsa yeni etiket (ör. v2.4.1-windows)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: kasa-windows-release
  cancel-in-progress: false

jobs:
  inputs:
    name: Check the optional draft request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate the optional draft tag
        env:
          CREATE_DRAFT: ${{ inputs.create_draft_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$CREATE_DRAFT" = true ] && ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            echo '::error::Taslak için geçerli, yeni bir vX.Y.Z[-ad] etiketi yazın.'
            exit 1
          fi

  package:
    name: Build the same installer and ZIP validated in CI
    needs: inputs
    uses: ./.github/workflows/windows-validation.yml

  draft:
    name: Create the explicitly requested GitHub draft
    if: inputs.create_draft_release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: release-artifact
      - name: Create a new draft without updating an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          # --target does not retarget an existing tag. Reject one to keep source and package identical.
          matching_refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq '.[] | .ref')
          while IFS= read -r ref; do
            if [ "$ref" = "refs/tags/$RELEASE_TAG" ]; then
              echo '::error::Bu etiket zaten var. Yeni ve benzersiz bir release_tag seçin.'
              exit 1
            fi
          done <<< "$matching_refs"
          gh release create "$RELEASE_TAG" release-artifact/* \
            --target "$SOURCE_SHA" --draft --title "Emar Kasa $VERSION — Windows x64" \
            --notes "Manually built self-contained Windows Setup, full update package, update feed and ZIP. Installation and local apply/restart were validated; this draft is not visible to the updater. Source commit: $SOURCE_SHA."
