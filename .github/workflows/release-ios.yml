name: iOS TestFlight release

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'compile-only: doğrula; build-ipa: imzalı dosya; upload-testflight: Apple yüklemesi'
        type: choice
        options:
          - compile-only
          - build-ipa
          - upload-testflight
        default: compile-only
        required: true
      build_number:
        description: 'İmzalı yayın için App Store Connect’tekinden büyük derleme numarası'
        type: string
        required: false
      confirm_upload:
        description: 'upload-testflight seçildiğinde Apple’a yüklemeyi onayla'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kasa-ios-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Restrict signing to the release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No environment and no secrets in this job. Compile-only remains usable on any branch.
      - name: Check the requested distribution branch
        env:
          RELEASE_ACTION: ${{ inputs.action }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_ACTION" != compile-only ] && [ "$SOURCE_REF" != refs/heads/release/2.x ]; then
            echo '::error::İmzalı iOS yayını yalnız release/2.x dalından başlatılabilir.'
            exit 1
          fi

  validate:
    needs: preflight
    uses: ./.github/workflows/ios-validation.yml

  release:
    name: Sign IPA and optionally upload
    if: inputs.action != 'compile-only'
    needs: validate
    runs-on: xcode-27
    timeout-minutes: 60
    # Put signing secrets here; branch restrictions/reviewers can be set in GitHub.
    environment: ios-release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check inputs and secret availability before installing tools
        env:
          IOS_RELEASE_ACTION: ${{ inputs.action }}
          IOS_CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: python3 .github/scripts/apple-release.py check
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.401'
          dotnet-quality: ga
      - name: Install the pinned Apple toolchain
        run: bash .github/scripts/apple-toolchain.sh
      - name: Import the distribution identity into a temporary keychain
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: python3 .github/scripts/apple-release.py prepare
      - name: Publish the signed device IPA
        id: package
        env:
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 .github/scripts/apple-release.py publish
      - name: Keep only the IPA, checksum and public build metadata
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kasa-ios-${{ steps.package.outputs.version }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/kasa-ios-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Validate and upload to App Store Connect
        if: inputs.action == 'upload-testflight' && inputs.confirm_upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: python3 .github/scripts/apple-release.py upload
      - name: Remove signing credentials and restore the keychain search list
        if: always()
        run: python3 .github/scripts/apple-release.py cleanup
      - name: Report the distribution stage
        env:
          RELEASE_ACTION: ${{ inputs.action }}
        run: |
          {
            echo '## iOS release'
            echo "Requested stage: $RELEASE_ACTION"
            echo 'The artifact contains the signed IPA. Apple upload, when selected, is only a submission to App Store Connect.'
            echo 'Wait for processing, configure compliance/internal testers, and validate the app on an iPhone before declaring it ready.'
          } >> "$GITHUB_STEP_SUMMARY"
