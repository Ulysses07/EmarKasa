# Mevcut API/veritabanı değiştirilmeden kasa görüntüleme arayüzü.
# /var/www/kasa-web/current/kasa-runtime.json saltOkunur=true olmalıdır.
server {
    listen 80;
    listen [::]:80;
    server_name kasa.emarglobal.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kasa-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://kasa.emarglobal.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kasa.emarglobal.com;
    ssl_certificate /etc/letsencrypt/live/kasa.emarglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasa.emarglobal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/kasa-web/current;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ =404; }
}
