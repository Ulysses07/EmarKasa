# DNS ve sertifika hazırlanırken yalnız ACME doğrulamasını sunar.
server {
    listen 80;
    listen [::]:80;
    server_name kasa.emarglobal.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kasa-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "Kasa HTTPS kurulumu hazirlaniyor.\n";
    }
}
