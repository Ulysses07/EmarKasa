# Bağımsız VPS dağıtımı — mevcut sistem nginx'i reverse proxy olarak kullanılır.
# Konteyner yalnızca 127.0.0.1:8080 dinler (dışarı kapalı); nginx 80/443'ten
# kasa.<domain> için proxy_pass eder ve certbot TLS'i sağlar.
# Çalıştır: cd deploy && docker compose -f docker-compose.nginx.yml up -d --build
services:
  kasa:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # /health yanıtında görünür: hangi commit'in canlıda olduğunu gösterir.
        KASA_SURUM: "${KASA_SURUM:-bilinmiyor}"
    image: kasa:latest
    container_name: kasa-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Europe/Istanbul
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Kasa: "Data Source=/data/kasa.db"
      Kasa__JwtKey: "${KASA_JWT_KEY}"
      Kasa__EditorKullanici: "${KASA_EDITOR_KULLANICI}"
      Kasa__EditorSifre: "${KASA_EDITOR_SIFRE}"
      # Günlük otomatik yedek (son 30 gün): host'ta deploy/kasa-data/yedek/
      Kasa__YedekKlasoru: "/data/yedek"
      # X-Forwarded-For'una güvenilecek proxy ağı (CIDR): bu compose projesinin ağının subnet'i (host nginx'i 127.0.0.1:8080 üzerinden docker-proxy ile gelir; kaynak IP bu ağın gateway'idir).
      # Değeri bul: deploy/README.md → "Güvenilir proxy ağı". deploy/.env'de KASA_GUVENILIR_AGLAR.
      Kasa__GuvenilirAglar: "${KASA_GUVENILIR_AGLAR}"
      # Tüm IP'ler toplamı için dakikalık giriş denemesi sınırı (varsayılan 60).
      # Kasa__GirisGlobalLimiti: "60"
    volumes:
      - ./kasa-data:/data
    ports:
      # Yalnızca localhost'a bağla — public erişim nginx üzerinden.
      - "127.0.0.1:8080:8080"
    # Konteyner logları döndürülür (en fazla 3 × 10 MB).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
