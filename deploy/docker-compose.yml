# Eski OrderDeck/Caddy ağına bağlanan alternatif şablon; canlı kurulum docker-compose.nginx.yml kullanır.
# Veri dizini (/data) ZORUNLU olarak deploy/.env içindeki KASA_DATA_DIR değişkeninden gelir;
# tanımsız veya boşsa `docker compose` hata verip durur. deploy/ altındaki ./kasa-data 2.0
# öncesinden korunmuş ESKİ veritabanıdır, /data'ya asla bağlanmaz. Ayrıntı: deploy/README.md.
services:
  kasa:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kasa:latest
    container_name: kasa-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Kasa: "Data Source=/data/kasa.db"
      Kasa__JwtKey: "${KASA_JWT_KEY}"
      Kasa__EditorKullanici: "${KASA_EDITOR_KULLANICI}"
      Kasa__EditorSifre: "${KASA_EDITOR_SIFRE}"
    volumes:
      - "${KASA_DATA_DIR:?KASA_DATA_DIR deploy/.env içinde etkin veri dizinine (yayın manifesti dataDirectory) ayarlanmalı; bkz. deploy/README.md}:/data"
    networks:
      - web
    expose:
      - "8080"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5

networks:
  web:
    # OrderDeck compose'unun oluşturduğu ağ (proje adı 'orderdeck' → 'orderdeck_web').
    external: true
    name: orderdeck_web
