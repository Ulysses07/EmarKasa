services:
  kasa:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # /health yanıtında görünür: hangi commit'in canlıda olduğunu gösterir.
        KASA_SURUM: "${KASA_SURUM:-bilinmiyor}"
    image: kasa:latest
    container_name: kasa-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Europe/Istanbul
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Kasa: "Data Source=/data/kasa.db"
      Kasa__JwtKey: "${KASA_JWT_KEY}"
      Kasa__EditorKullanici: "${KASA_EDITOR_KULLANICI}"
      Kasa__EditorSifre: "${KASA_EDITOR_SIFRE}"
      # Günlük otomatik yedek (son 30 gün): host'ta deploy/kasa-data/yedek/
      Kasa__YedekKlasoru: "/data/yedek"
      # Sunucu dışı yedeğin (kasa-yedek servisi) durum dosyası; /health → "uzakYedek".
      Kasa__UzakYedekDurumDosyasi: "/data/uzak-yedek/durum.json"
      # X-Forwarded-For'una güvenilecek proxy ağı (CIDR): orderdeck_web ağının subnet'i (Caddy bu ağdan bağlanır).
      # Değeri bul: deploy/README.md → "Güvenilir proxy ağı". deploy/.env'de KASA_GUVENILIR_AGLAR.
      Kasa__GuvenilirAglar: "${KASA_GUVENILIR_AGLAR}"
      # Tüm IP'ler toplamı için dakikalık giriş denemesi sınırı (varsayılan 60).
      # Kasa__GirisGlobalLimiti: "60"
      # Editör şifresini unutunca kurtarma: deploy/.env'de KASA_EDITOR_SIFRESINI_SIFIRLA=true + yeniden başlat
      # (.env şifresi yeniden geçerli olur, iki adımlı giriş kapanır). İş bitince false. deploy/README.md → "Kullanıcılar ve güvenlik".
      Kasa__EditorSifresiniSifirla: "${KASA_EDITOR_SIFRESINI_SIFIRLA:-false}"
      # Giriş günlüğünün saklama süresi (gün, varsayılan 180).
      # Kasa__GirisGunluguGun: "180"
      # Fiş/fatura ekleri: varsayılan /data/belgeler (host'ta kasa-data/belgeler). Değiştirilirse
      # /data altında kalmalı ve kasa-yedek'e KASA_BELGE_KLASORU olarak da verilmeli.
      # Kasa__BelgeKlasoru: "/data/belgeler"
    volumes:
      - ./kasa-data:/data
    networks:
      - web
    expose:
      - "8080"
    # Konteyner logları döndürülür (en fazla 3 × 10 MB).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5

  # Sunucu dışı yedek: her gece en yeni günlük yedeği sıkıştırıp şifreler (rclone crypt) ve
  # uzak hedefe (Google Drive / başka sunucu / S3) gönderir; haftada bir indirip doğrular.
  # KASA_UZAK_HEDEF boşsa hiçbir şey göndermez. Kurulum: deploy/README.md → "Sunucu dışı yedek".
  kasa-yedek:
    build:
      context: ./uzak-yedek
    image: kasa-yedek:latest
    container_name: kasa-yedek
    restart: unless-stopped
    init: true
    # Uygulamayla aynı kullanıcı: kasa-data'ya yazdığı dosyalar (durum, rclone ayarı) 1654'e ait olur.
    user: "1654:1654"
    environment:
      TZ: Europe/Istanbul
      KASA_UZAK_HEDEF: "${KASA_UZAK_HEDEF:-}"
      KASA_YEDEK_SIFRE: "${KASA_YEDEK_SIFRE:-}"
      KASA_UZAK_SAAT: "${KASA_UZAK_SAAT:-03:30}"
      KASA_DOGRULAMA_GUNU: "${KASA_DOGRULAMA_GUNU:-7}"
    # Yedekleri ve fiş/fatura eklerini (belgeler/) okur; durum dosyasını, rclone ayarını ve geri alınan kopyaları
    # kasa-data/uzak-yedek/ altına yazar ("ekleri-geri-al" komutu eksik ekleri belgeler/ içine indirir).
    volumes:
      - ./kasa-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5

networks:
  web:
    # OrderDeck compose'unun oluşturduğu ağ (proje adı 'orderdeck' → 'orderdeck_web').
    external: true
    name: orderdeck_web
