  - text: Toplam kart borcu
  - strong: /₺\d+,\d+/
  - text: Kalan kredi planı
  - strong: /₺\d+,\d+/
  - paragraph: Bu aralıkta kayıtlı ödeme yok.
  - paragraph: Yeni kart takibinde kaydedilen kart ödemeleri kasadan düşer; kredi taksitleri kendi tarihinde otomatik işlenir. Eski kayıtlarda geçiş öncesi kasa kuralı korunur. Sabit, ortak ve dağılım bekleyen giderler nedeniyle kanal toplamı genel kasadan farklı olabilir.
  - heading "Alışlar" [level=2]
