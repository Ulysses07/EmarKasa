  - text: "/MEZAT ₺\\d+\\.\\d+,\\d+ Kalan kart borcu: ₺\\d+,\\d+ PERAKENDE ₺\\d+\\.\\d+,\\d+ Kalan kart borcu: ₺\\d+,\\d+ TOPTAN ₺\\d+\\.\\d+,\\d+ Kalan kart borcu: ₺\\d+,\\d+/"
  - paragraph: Kart borçları kasa bakiyesine dahil edilmez; ödeme kaydedildiğinde kasadan düşer.
  - heading "Gerçek bakiye karşılaştırmaları" [level=2]
  - paragraph: Kayıt anındaki genel kasa ile sizin bildirdiğiniz gerçek bakiye karşılaştırılır. Fark otomatik gelir veya gider yazılmaz. Kayıt gününe ya da öncesine sonradan girilen, silinen veya düzeltilen kayıtlar güncel durumu değiştirir; kayıtlı değerler değişmez.
  - region "Gerçek bakiye karşılaştırmaları":
    - table:
      - rowgroup:
        - row "Kayıt zamanı Kayıtlı genel kasa Gerçek bakiye Gerçek − kayıtlı Güncel durum Not":
          - columnheader "Kayıt zamanı"
          - columnheader "Kayıtlı genel kasa"
          - columnheader "Gerçek bakiye"
          - columnheader "Gerçek − kayıtlı"
          - columnheader "Güncel durum"
          - columnheader "Not"
          - columnheader
      - rowgroup:
        - row /\d+\.\d+\.\d+ \d+:\d+:\d+ ₺\d+\.\d+,\d+ ₺\d+\.\d+,\d+ -₺\d+,\d+ Kayıttan sonra değişmedi Akşam sayımında \d+ ₺ eksik\. Değişenleri göster Farkı açıkla/:
          - cell /\d+\.\d+\.\d+ \d+:\d+:\d+/
          - cell /₺\d+\.\d+,\d+/
          - cell /₺\d+\.\d+,\d+/
          - cell /-₺\d+,\d+/
          - cell "Kayıttan sonra değişmedi"
          - cell /Akşam sayımında \d+ ₺ eksik\./
