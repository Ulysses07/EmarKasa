  - paragraph: Genel kasa ve kanal bakiyeleri
  - heading "Kasalar" [level=1]
  - button "+ Gelir gir"
  - button "+ Gider kaydet"
  - text: Genel kasa
  - region "Genel kasa": /₺\d+\.\d+,\d+/
  - text: Bu haftanın sonucu
  - strong: /₺\d+\.\d+,\d+/
  - text: Bu ayın sonucu
  - strong: /₺\d+\.\d+,\d+/
  - text: Kanal sayısı
  - strong: "3"
