- main:
  - paragraph: Genel kasa gider kayıtları
  - heading "İşlemler" [level=1]
  - button "Gider raporu indir"
  - button "+ Gelir gir"
  - button "+ Gider kaydet"
  - text: Başlangıç
  - textbox "Başlangıç": /\d+-\d+-\d+/
  - text: Bitiş
  - textbox "Bitiş": /\d+-\d+-\d+/
  - text: Kanal
  - combobox "Kanal":
    - option "Tüm kanallar" [selected]
    - option "MEZAT"
    - option "PERAKENDE"
    - option "TOPTAN"
    - option "Ortak"
    - option "Dağılım bekliyor"
  - text: Açıklama / ödeme yapılan yer
  - searchbox "Açıklama / ödeme yapılan yer"
  - button "Listele"
  - paragraph: Kanal filtresi ilgili giderin tam tutarını gösterir; çok kanallı bir ödemenin kanal payı toplamı değildir. Alışa bağlı ödemeler alış kaydından düzeltilir.
  - table:
    - rowgroup:
      - row "Tarih Açıklama Kanal Tür Tutar":
        - columnheader "Tarih"
        - columnheader "Açıklama"
        - columnheader "Kanal"
        - columnheader "Tür"
        - columnheader "Tutar"
        - columnheader
